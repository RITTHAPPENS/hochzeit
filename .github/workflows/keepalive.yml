# Pingt Supabase zweimal pro Woche an, damit das kostenlose Projekt nicht pausiert.
# Benötigt die Repository-Variablen SUPABASE_URL und SUPABASE_ANON_KEY
# (Settings → Secrets and variables → Actions → Variables).
name: Supabase Keepalive
on:
  schedule:
    - cron: "17 6 * * 1,4"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping
        run: |
          curl -fsS -X POST "${{ vars.SUPABASE_URL }}/rest/v1/rpc/ping" \
            -H "apikey: ${{ vars.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ vars.SUPABASE_ANON_KEY }}" \
            -H "Content-Type: application/json" -d '{}'
